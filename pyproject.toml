[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cjcplot"
version = "0.1.0"
description = "Publication-ready matplotlib figures sized to a LaTeX text width, with switchable styles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "C.J.C. Scheper" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

# Style folders are data, not subpackages: ship their .mplstyle and colors.py files.
[tool.setuptools.package-data]
"cjcplot.styles" = ["*/*.mplstyle", "*/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
